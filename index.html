<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💾 RETRO AI IMAGE GENERATOR v1.0</title>
    <style>
        /* 复古 Windows 95 / 像素风主题 */
        :root {
            --bg-color: #008080; /* 经典搬砖绿 */
            --win-bg: #c0c0c0;
            --win-edge-light: #ffffff;
            --win-edge-dark: #808080;
            --win-text: #000000;
            --btn-highlight: #000080;
        }

        * {
            box-sizing: border-box;
            font-family: "Courier New", Courier, monospace, "SimSun";
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--win-text);
        }

        /* 模拟标准 Windows 窗口 */
        .window {
            background: var(--win-bg);
            border: 3px solid;
            border-color: var(--win-edge-light) var(--win-edge-dark) var(--win-edge-dark) var(--win-edge-light);
            width: 100%;
            max-width: 650px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
            padding: 3px;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .title-bar-controls button {
            padding: 1px 6px;
            font-size: 10px;
            font-weight: bold;
            background: var(--win-bg);
            border: 1px solid;
            border-color: var(--win-edge-light) var(--win-edge-dark) var(--win-edge-dark) var(--win-edge-light);
        }

        .window-content {
            padding: 15px;
        }

        .field-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 6px;
            background: #ffffff;
            border: 2px solid;
            border-color: var(--win-edge-dark) var(--win-edge-light) var(--win-edge-light) var(--win-edge-dark);
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            background: #ffffcc; /* 聚焦时高亮，老旧表单感 */
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* 复古按钮 */
        button.win-btn {
            padding: 8px 20px;
            background: var(--win-bg);
            border: 2px solid;
            border-color: var(--win-edge-light) var(--win-edge-dark) var(--win-edge-dark) var(--win-edge-light);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: block;
            width: 100%;
            margin-top: 15px;
        }

        button.win-btn:active {
            border-color: var(--win-edge-dark) var(--win-edge-light) var(--win-edge-light) var(--win-edge-dark);
            padding: 9px 19px 7px 21px;
        }

        /* 终端/控制台样式输出 */
        .console-box {
            margin-top: 15px;
            background: #000000;
            color: #00ff00;
            padding: 10px;
            font-size: 12px;
            height: 80px;
            overflow-y: auto;
            border: 2px solid inset;
            border-color: var(--win-edge-dark) var(--win-edge-light) var(--win-edge-light) var(--win-edge-dark);
        }

        /* 图片预览区域 */
        .preview-zone {
            margin-top: 15px;
            border: 2px dashed var(--win-edge-dark);
            background: #808080;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .preview-zone img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            color: #e0e0e0;
            font-size: 14px;
            text-align: center;
        }

        /* 闪烁的点缀特效 */
        @keyframes blink {
            50% { opacity: 0; }
        }
        .cursor {
            animation: blink 1s step-start infinite;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>🖼️ AI_IMAGE_GENERATOR.EXE</span>
        <div class="title-bar-controls">
            <button>?</button>
            <button>X</button>
        </div>
    </div>
    
    <div class="window-content">
        <div class="field-group">
            <label>💾 第三方中转站 Base URL:</label>
            <input type="text" id="baseUrl" value="https://api.openai-proxy.org/v1" placeholder="例如: https://your-proxy.com/v1">
        </div>

        <div class="field-group">
            <label>🔑 API Secret Key:</label>
            <input type="password" id="apiKey" placeholder="sk-********************************">
        </div>

        <div class="row">
            <div class="field-group">
                <label>🤖 目标模型群组:</label>
                <select id="modelPreset" onchange="updateModelName()">
                    <option value="gpt2">GPT image 2 (DALL-E 2/3)</option>
                    <option value="qwen">阿里云千问生图 (Wanx)</option>
                    <option value="gemini">Gemini Nano / Banana</option>
                    <option value="custom">-- 自定义模型名称 --</option>
                </select>
            </div>
            <div class="field-group">
                <label>🆔 模型命名空间 (Model ID):</label>
                <input type="text" id="modelName" value="dall-e-3">
            </div>
        </div>

        <div class="field-group">
            <label>📝 图像提示词 (Prompt):</label>
            <textarea id="prompt" rows="3" placeholder="A retro cyberpunk hacker terminal, 8bit pixel art..."></textarea>
        </div>

        <button class="win-btn" onclick="generateImage()">执行生成 [ENTER]</button>

        <div class="console-box" id="console">
            SYSTEM READY.<br>
            Awaiting user input...<span class="cursor">_</span>
        </div>

        <div class="preview-zone" id="previewZone">
            <span class="placeholder-text" id="placeholder">NO DATA IN BUFFER</span>
            <img id="outputImage" alt="Generated Output">
        </div>
    </div>
</div>

<script>
    // 预设模型名称映射，方便用户快速选择
    const presetMap = {
        gpt2: "dall-e-3",
        qwen: "wanx-v1",
        gemini: "gemini-nano-banana" // 根据你中转站的实际命名填写
    };

    function updateModelName() {
        const preset = document.getElementById('modelPreset').value;
        if (preset !== 'custom') {
            document.getElementById('modelName').value = presetMap[preset];
        }
    }

    function log(text, isError = false) {
        const consoleBox = document.getElementById('console');
        const color = isError ? '#ff0000' : '#00ff00';
        consoleBox.innerHTML += `<br><span style="color: ${color}">> ${text}</span>`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function generateImage() {
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const model = document.getElementById('modelName').value.trim();
        const prompt = document.getElementById('prompt').value.trim();

        if (!apiKey || !prompt) {
            log('错误: API Key 或 提示词不能为空！', true);
            return;
        }

        log('初始化连接请求...');
        
        // 自动格式化 URL 路径
        let targetUrl = baseUrl;
        if (!targetUrl.endsWith('/images/generations')) {
            targetUrl = targetUrl.replace(/\/$/, '') + '/images/generations';
        }

        // 构建大多数中转站兼容的标准 OpenAI 格式请求体
        let requestBody = {
            model: model,
            prompt: prompt,
            n: 1,
            size: "1024x1024"
        };

        // 如果是阿里云千问的非中转原生包装（万一中转站要求原生格式）
        const selectedPreset = document.getElementById('modelPreset').value;
        if (selectedPreset === 'qwen' && !baseUrl.includes('openai')) {
            // 这里可以根据特殊中转站调整结构，默认我们走标准模式
        }

        try {
            log(`发送数据包至模型 [${model}]...`);
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const errData = await response.text();
                throw new Error(`HTTP ${response.status} - ${errData}`);
            }

            const data = await response.json();
            log('收到返回数据，正在解析图像缓冲区...');

            // 解析返回的图片 URL（兼容标准的 data[0].url）
            let imageUrl = "";
            if (data.data && data.data[0] && data.data[0].url) {
                imageUrl = data.data[0].url;
            } else if (data.output && data.output.results && data.output.results[0].url) {
                imageUrl = data.output.results[0].url; // 兼容部分千问原生格式
            } else {
                throw new Error('未能在响应体中匹配到合法的图片 URL 字段。');
            }

            // 渲染图片
            const imgEl = document.getElementById('outputImage');
            const placeholder = document.getElementById('placeholder');
            
            imgEl.src = imageUrl;
            imgEl.style.display = 'block';
            placeholder.style.display = 'none';
            
            log('图像生成成功！渲染完毕。');

        } catch (error) {
            log(`发生中断: ${error.message}`, true);
            console.error(error);
        }
    }
</script>
</body>
</html>
